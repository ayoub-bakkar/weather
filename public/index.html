<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Weather</title>
    <!--kit icon in fontAwesome-->
    <script
      src="https://kit.fontawesome.com/c56a1c185e.js"
      crossorigin="anonymous"
    ></script>
    <!--font-->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <div class="title">
        <i id="icon-tilte-weather" class="fa-regular fa-cloud"></i>
        <span>SkyPulse</span>
      </div>
      <div class="search">
        <i id="icon-search" class="fa-solid fa-magnifying-glass"></i>
        <input id="cityName" type="text" placeholder="city..." value="jordan" />
      </div>
    </header>
    <br />
    <div class="city-stlye">
      <div class="info-city">
        <h1 class="city">irbid</h1>
        <p class="country">jordan</p>
        <span id="time">12:45 PM PST</span>
      </div>
      <div class="iconWeather">
        <img class="image" src="" alt="" />
      </div>
    </div>

    <div class="info-temp">
      <h2 class="temp">
        0 <sup class="unit"><span>c</span></sup>
      </h2>
      <h3 class="description"></h3>
    </div>
    <div class="shadow"></div>

    <!--CARDS info weather-->
    <div id="details-container" class="cards">
      <!--Feels Like-->
      <div class="single-card">
        <div class="titel-card">
          <i id="icon-info" class="fa-solid fa-temperature-half"></i>
          <span>Feels Like</span>
        </div>
        <div>
          <h4 data-key="feels_like" class="degree">0</h4>
        </div>
      </div>
      <!--Humidity-->
      <div class="single-card">
        <div class="titel-card">
          <i id="icon-info" class="fa-solid fa-droplet"></i>
          <span>Humidity</span>
        </div>
        <div>
          <h4 data-key="humidity" class="degree">0</h4>
        </div>
      </div>

      <!--Clouds-->
      <div class="single-card">
        <div class="titel-card">
          <i id="icon-info" class="fa-solid fa-cloud"></i>
          <span>Clouds</span>
        </div>
        <div>
          <h4 data-key="clouds" class="degree">0</h4>
        </div>
      </div>
      <!--Visibility-->
      <div class="single-card">
        <div class="titel-card">
          <i id="icon-info" class="fa-regular fa-eye"></i>
          <span>Visibility</span>
        </div>
        <div>
          <h4 data-key="visibility" class="degree">0</h4>
        </div>
      </div>
      <!--Feels Like-->
      <div class="single-card">
        <div class="titel-card">
          <i id="icon-info" class="fa-solid fa-wind"></i>
          <span>Wind</span>
        </div>
        <div>
          <h4 data-key="speedWind" class="degree">0</h4>
        </div>
      </div>
    </div>
    <script src="app.js" type="module"></script>
  </body>
</html>
